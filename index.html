    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { min-height: 100vh; }

        @keyframes stamp {
            0% { transform: scale(2) rotate(-20deg); opacity: 0; }
            40% { transform: scale(0.9) rotate(-8deg); opacity: 1; }
            60% { transform: scale(1.05) rotate(-14deg); opacity: 1; }
            100% { transform: scale(1) rotate(-12deg); opacity: 0.9; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .animate-stamp {
            animation: stamp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-fadeIn {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .animate-twinkle {
            animation: twinkle ease-in-out infinite;
        }
    </style>
</head>

          </svg>
        );

        function BrilliantMothersDisco() {
          const [started, setStarted] = useState(false);
          const [completed, setCompleted] = useState(new Set());
          const [currentCard, setCurrentCard] = useState(null);
          const [isFlipping, setIsFlipping] = useState(false);
          const [showStamp, setShowStamp] = useState(false);
          const [showAllCards, setShowAllCards] = useState(false);

          const drawCard = () => {
            const available = experiments.filter(e => !completed.has(e.id));
            if (available.length === 0) return;

            setShowStamp(false);
            setIsFlipping(true);

            setTimeout(() => {
              const randomIndex = Math.floor(Math.random() * available.length);
              setCurrentCard(available[randomIndex]);
              setIsFlipping(false);
            }, 300);
          };

          useEffect(() => {
            setShowStamp(false);
          }, [currentCard?.id]);

          const startGame = () => {
            setStarted(true);
            setTimeout(() => drawCard(), 100);
          };

          const markDone = () => {
            if (!currentCard) return;
            setShowStamp(true);
            setTimeout(() => {
              const newCompleted = new Set(completed);
              newCompleted.add(currentCard.id);
              setCompleted(newCompleted);
            }, 600);
          };

          const remaining = experiments.length - completed.size;
          const allDone = remaining === 0;

          return (
            <div
              className="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden"
              style={{
                background: 'linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%)',

                    className="absolute rounded-full animate-twinkle"
                    style={{

                            <ul className="space-y-2">

                                  key={i}
                                  href={link.url}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium transition-all hover:scale-105"
                                  style={{
                                    background: currentCard.special
                                      ? 'linear-gradient(135deg, #ec4899, #a855f7)'
                                      : 'rgba(255,255,255,0.1)',
                                    color: 'white',
                                    border: currentCard.special ? 'none' : '1px solid rgba(255,255,255,0.2)'
                                  }}
                                >
                                  {link.name}
                                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                  </svg>
                                </a>
                              ))}
                            </div>
                          )}

                          <div className="flex gap-3">
                            {!completed.has(currentCard.id) && !showStamp ? (
                              <button
                                onClick={markDone}
                                className="flex-1 py-3.5 rounded-full font-semibold transition-all hover:scale-[1.02] active:scale-[0.98]"
                                style={{
                                  background: 'linear-gradient(135deg, #f59e0b, #d97706)',
                                  color: 'white',
                                  boxShadow: '0 10px 30px rgba(245,158,11,0.3)'
                                }}
                              >
                                I tried this! ✦
                              </button>
                            ) : showStamp ? (
                              <div
                                className="flex-1 py-3.5 rounded-full font-semibold text-center"
                                style={{
                                  background: 'linear-gradient(135deg, rgba(245,158,11,0.2), rgba(217,119,6,0.2))',
                                  color: '#fbbf24',
                                  border: '1px solid rgba(245,158,11,0.4)'
                                }}
                              >
                                ✦ Done! ✦
                              </div>
                            ) : (
                              <div
                                className="flex-1 py-3.5 rounded-full font-semibold text-center"
                                style={{
                                  background: 'rgba(255,255,255,0.05)',
                                  color: 'rgba(255,255,255,0.4)',
                                  border: '1px solid rgba(255,255,255,0.1)'
                                }}
                              >
                                Completed ✓
                              </div>
                            )}

                            {!allDone && (
                              <button
                                onClick={drawCard}
                                className="flex-1 py-3.5 rounded-full font-semibold transition-all hover:scale-[1.02] active:scale-[0.98] hover:bg-white/20"
                                style={{
                                  background: 'rgba(255,255,255,0.1)',
                                  color: 'white',
                                  border: '1px solid rgba(255,255,255,0.2)'
                                }}
                              >
                                Draw Again
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  {!allDone && (
                    <button
                      onClick={() => setShowAllCards(true)}
                      className="mt-6 text-sm transition-all hover:scale-105"
                      style={{ color: 'rgba(255,255,255,0.5)' }}
                    >
                      See all experiments →
                    </button>
                  )}

                  {allDone && (
                    <div className="mt-8 text-center animate-fadeIn">
                      <div className="text-4xl mb-4">🎉</div>
                      <h3
                        className="text-xl font-bold mb-2"
                        style={{
                          fontFamily: "'Playfair Display', Georgia, serif",
                          color: 'white'
                        }}
                      >
                        You tried them all!
                      </h3>
                      <p style={{ color: 'rgba(255,255,255,0.6)' }}>
                        You're officially a Brilliant Mother
                      </p>
                    </div>
                  )}

                  <footer className="mt-10 text-center">
                    <p className="text-sm" style={{ color: 'rgba(255,255,255,0.3)' }}>
                      Crafted with care by{' '}
                      <a
                        href="https://brilliantfailures.xyz"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="hover:opacity-70 transition-opacity"
                        style={{ color: 'rgba(236,72,153,0.6)' }}
                      >
                        Brilliant Failures
                      </a>
                    </p>
                  </footer>
                </>
              )}

              {showAllCards && (
                <div
                  className="fixed inset-0 z-50 overflow-y-auto"
                  style={{ background: 'rgba(10,10,26,0.9)', backdropFilter: 'blur(8px)' }}
                  onClick={() => setShowAllCards(false)}
                >
                  <div className="min-h-screen px-4 py-8">
                    <div
                      className="max-w-2xl mx-auto rounded-3xl overflow-hidden"
                      style={{
                        background: 'linear-gradient(165deg, rgba(30,30,50,0.95) 0%, rgba(20,20,40,0.98) 100%)',
                        boxShadow: '0 25px 50px rgba(0,0,0,0.5)',
                        border: '1px solid rgba(255,255,255,0.1)'
                      }}
                      onClick={(e) => e.stopPropagation()}
                    >
                      <div
                        className="sticky top-0 z-10 p-5 flex items-center justify-between"
                        style={{
                          background: 'rgba(20,20,40,0.95)',
                          borderBottom: '1px solid rgba(255,255,255,0.1)',
                          backdropFilter: 'blur(10px)'
                        }}
                      >
                        <div>
                          <h2
                            className="text-xl font-bold"
                            style={{
                              fontFamily: "'Playfair Display', Georgia, serif",
                              color: 'white'
                            }}
                          >
                            All Experiments
                          </h2>
                          <p className="text-sm" style={{ color: 'rgba(255,255,255,0.5)' }}>
                            {completed.size} of {experiments.length} completed
                          </p>
                        </div>
                        <button
                          onClick={() => setShowAllCards(false)}
                          className="w-10 h-10 rounded-full flex items-center justify-center transition-colors"
                          style={{
                            background: 'rgba(255,255,255,0.1)',
                            color: 'white'
                          }}
                        >
                          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                          </svg>
                        </button>
                      </div>

                      <div className="p-4 space-y-3">
                        {experiments.map((experiment) => {
                          const isDone = completed.has(experiment.id);
                          return (
                            <button
                              key={experiment.id}
                              onClick={() => {
                                setCurrentCard(experiment);
                                setShowAllCards(false);
                                setShowStamp(false);
                              }}
                              className={`w-full text-left p-4 rounded-2xl transition-all hover:scale-[1.01] active:scale-[0.99] ${isDone ? 'opacity-60' : ''}`}
                              style={{
                                background: experiment.special
                                  ? 'linear-gradient(135deg, rgba(236,72,153,0.15), rgba(168,85,247,0.15))'
                                  : 'rgba(255,255,255,0.05)',
                                border: experiment.special
                                  ? '1px solid rgba(236,72,153,0.3)'
                                  : '1px solid rgba(255,255,255,0.1)'
                              }}
                            >
                              <div className="flex items-start gap-3">
                                <div
                                  className="flex-shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center mt-0.5"
                                  style={{
                                    borderColor: isDone ? '#fbbf24' : 'rgba(255,255,255,0.2)',
                                    background: isDone ? 'linear-gradient(135deg, #f59e0b, #fbbf24)' : 'transparent'
                                  }}
                                >
                                  {isDone && (
                                    <svg className="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" strokeWidth={3} viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                  )}
                                </div>

                                <div className="flex-1 min-w-0">
                                  <div className="flex items-center gap-2">
                                    <span
                                      className="text-xs"
                                      style={{ color: experiment.special ? '#f472b6' : 'rgba(255,255,255,0.4)' }}
                                    >
                                      {experiment.special ? '✦' : `${experiment.id}.`}
                                    </span>
                                    <h3
                                      className="font-semibold truncate"
                                      style={{
                                        fontFamily: "'DM Sans', sans-serif",
                                        color: 'white'
                                      }}
                                    >
                                      {experiment.title}
                                    </h3>
                                  </div>
                                  <p
                                    className="text-sm mt-1 line-clamp-2"
                                    style={{ color: 'rgba(255,255,255,0.5)' }}
                                  >
                                    {experiment.description}
                                  </p>
                                </div>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BrilliantMothersDisco />);
    </script>
</body>
</html>
